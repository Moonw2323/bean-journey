<body>
<a class="skip" href="#main">Skip to content</a>
<header><nav aria-label="Main"><span class="logo">Bean Journey</span><a href="index.html">Home</a><a href="journey.html">Journey</a><a href="subscribe.html" aria-current="page">Subscribe</a><a href="about.html">About</a></nav></header>
<main id="main">
<h1>Subscribe to Bean Journey</h1>
<p>Choose a blend and how often you want it. All fields are required.</p>
<form id="sub-form" novalidate>
<label for="name">Full name</label>
<input type="text" id="name" name="name" autocomplete="name" aria-describedby="name-err" required>
<p class="err" id="name-err"></p>
<label for="email">Email address</label>
<input type="email" id="email" name="email" autocomplete="email" aria-describedby="email-err" required>
<p class="err" id="email-err"></p>
<label for="blend">Blend</label>
<select id="blend" name="blend" aria-describedby="blend-err" required><option value="">Choose a blend</option><option>Yirgacheffe</option><option>Huila</option><option>Santos</option></select>
<p class="err" id="blend-err"></p>
<fieldset><legend>Grind</legend>
<label class="opt"><input type="radio" name="grind" value="Whole bean" checked> Whole bean</label>
<label class="opt"><input type="radio" name="grind" value="Filter"> Filter</label>
<label class="opt"><input type="radio" name="grind" value="Espresso"> Espresso</label></fieldset>
<label for="frequency">Delivery</label>
<select id="frequency" name="frequency" aria-describedby="frequency-err" required><option value="">Choose frequency</option><option>Weekly</option><option>Every 2 weeks</option><option>Monthly</option></select>
<p class="err" id="frequency-err"></p>
<p><button class="btn" type="submit">Add subscription</button></p>
<p id="msg" role="status"></p>
</form>
<h2>Your subscriptions</h2>
<ul id="subs"></ul>
<button class="btn alt" id="clear" type="button">Clear all</button>
</main>
<footer>&copy; 2026 Bean Journey. A student project for COM109.</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

</body>
</html>
